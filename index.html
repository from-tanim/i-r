      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;

    }

    .logo-loader {
      width: 60px;
      height: 60px;
     
  animation: fade 2s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes fade {
  0%, 100% {
    opacity: 0.2;
  }
  50% {
    opacity: 1;
  }
}

    h2 {
      color: #343a40;
    }

    p {
      color: #6c757d;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

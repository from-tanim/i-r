<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invert PDF Colors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #181818;
            --container-bg: #222;
            --text-color: #fff;
            --button-bg: #00c853;
            --button-hover: #009624;
        }
        .light-mode {
            --bg-color: #f5f5f5;
            --container-bg: #ffffff;
            --text-color: #333;
            --button-bg: #007BFF;
            --button-hover: #0056b3;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin-bottom: 60px;
        }
        .container {
            max-width: 850px;
            margin: auto;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
        }
        #pdfContainer {
            width: 100%;
            height: 500px;
            overflow: auto;
            margin-top: 15px;
        }
        canvas {
            display: block;
            margin: 10px auto;
            border: 1px solid #555;
        }
        .btn {
            background: var(--button-bg);
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        #fileUploadStatus {
            margin: 10px 0;
            color: var(--button-bg);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF Color Inverter</h1>
        <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">
        <button onclick="document.getElementById('pdfInput').click()" class="btn">Upload PDF</button>
        
        <div id="fileUploadStatus"></div>
        
        <div id="actionButtons" style="display:none;">
            <button id="readBtn" class="btn">View Inverted PDF</button>
            <button id="downloadBtn" class="btn">Download Original PDF</button>
        </div>
        
        <div id="pdfContainer"></div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js";
        
        let pdfDoc = null;
        const copyrightImageUrl = 'https://raw.githubusercontent.com/from-tanim/invert-read/refs/heads/Main/Assets/copy%CA%A4.png'; 
        document.getElementById('pdfInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('fileUploadStatus').textContent = "Uploading PDF...";
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                pdfDoc = await loadingTask.promise;
                
                document.getElementById('fileUploadStatus').textContent = "PDF uploaded successfully!";
                document.getElementById('actionButtons').style.display = 'block';
            } catch (error) {
                document.getElementById('fileUploadStatus').textContent = "Error uploading PDF";
                console.error(error);
            }
        });

        document.getElementById('readBtn').addEventListener('click', async function() {
            if (!pdfDoc) return;
            
            const container = document.getElementById('pdfContainer');
            container.innerHTML = "";
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const canvas = document.createElement('canvas');
                container.appendChild(canvas);
                
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                }).promise;
                
                invertColors(canvas);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', async function() {
            if (!pdfDoc) return;
            
            const pdf = new jsPDF();
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const canvas = document.createElement('canvas');
                const viewport = page.getViewport({ scale: 1.0 });
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                }).promise;
                
                if (i > 1) pdf.addPage();
                
                const imgData = canvas.toDataURL('image/jpeg');
                pdf.addImage(imgData, 'JPEG', 10, 10, 190, 0);
            }
            
            // Add copyright page
            pdf.addPage();
            pdf.text("Copyright © From-Tanim", 105, 140, { align: 'center' });
            
            pdf.save('original_with_copyright.pdf');
        });

        function invertColors(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                data[i] = 255 - data[i];
                data[i + 1] = 255 - data[i + 1];
                data[i + 2] = 255 - data[i + 2];
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
    </script>
</body>
</html>
